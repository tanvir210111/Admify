# CloudPanel Nginx Vhost Configuration for Admify Backend API (https://api.admify.world)
# 
# In CloudPanel -> Sites -> Add Site -> Node.js (or Reverse Proxy):
# Set domain to: api.admify.world
#
# If configured as Reverse Proxy / Custom Nginx Vhost, paste the following into Vhost:

location / {
  proxy_pass http://127.0.0.1:5000;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection 'upgrade';
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_cache_bypass $http_upgrade;
  proxy_read_timeout 90;
}

# Block hidden files (except .well-known for Let's Encrypt SSL certificates)
location ~ /\.(?!well-known).* {
  deny all;
}
