# CloudPanel Nginx Vhost Configuration for Admify Backend API (https://api.admify.world)
# 
# In CloudPanel -> Sites -> Add Site -> Node.js Site (or Reverse Proxy Site):
# 1. Set Domain: api.admify.world
# 2. Set App Port: 5000
# 3. In Sites -> api.admify.world -> Vhost, paste or verify this configuration:

location / {
  proxy_pass http://127.0.0.1:5000;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection 'upgrade';
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_cache_bypass $http_upgrade;
  proxy_connect_timeout 60s;
  proxy_send_timeout 90s;
  proxy_read_timeout 90s;
  client_max_body_size 25M;
}

# Block hidden files (except .well-known for Let's Encrypt SSL verification)
location ~ /\.(?!well-known).* {
  deny all;
}
