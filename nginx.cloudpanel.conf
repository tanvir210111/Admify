# CloudPanel Nginx Vhost Configuration for Admify Frontend SPA (https://admify.world)
#
# ISSUE EXPLANATION:
# In CloudPanel's default static/HTML site configuration, the root location is:
#   location / {
#     try_files $uri $uri/ =404;
#   }
# When a visitor directly navigates or refreshes any frontend React route (e.g. /admin, /admin/login, /features),
# Nginx checks if a physical directory or file named "/admin" exists on the server.
# Since this is a Single Page Application (SPA), only index.html exists, causing Nginx to return a 404 Not Found.
#
# SOLUTION:
# In CloudPanel -> Sites -> admify.world -> Vhost:
# Update the location / block to:
#   location / {
#     try_files $uri $uri/ /index.html;
#   }
#
# ─────────────────────────────────────────────────────────────────────────────
# RECOMMENDED LOCATION BLOCKS TO PASTE INTO CLOUDPANEL VHOST:
# ─────────────────────────────────────────────────────────────────────────────

location / {
  try_files $uri $uri/ /index.html;
}

# Static asset caching (JS, CSS, images, fonts)
location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
  expires 6M;
  access_log off;
  add_header Cache-Control "public, max-age=15552000, immutable";
  try_files $uri =404;
}

