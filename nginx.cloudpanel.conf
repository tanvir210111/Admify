# CloudPanel Nginx Vhost Configuration for Admify (https://admify.world)
# 
# To ensure SPA (React Router) direct routes work without 404s:
# In CloudPanel -> Sites -> admify.world -> Vhost:
# Update the main location block to fallback to /index.html:

location / {
  try_files $uri $uri/ /index.html;
}

# Static asset caching (recommended for production performance)
location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
  expires 6M;
  access_log off;
  add_header Cache-Control "public, max-age=15552000, immutable";
  try_files $uri =404;
}
